# Fork-only: lives on the `phone` branch, never on feature branches meant for upstream.
# Builds the debug APK signed with a fixed debug key, so new builds install over old ones.
name: Phone build

on:
    push:
        branches: [phone]
    workflow_dispatch:

concurrency:
    group: phone-build
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
              with:
                  java-version: 17
                  distribution: "temurin"
            - uses: FossifyOrg/.github/.github/actions/gradle-cache@main

            - name: Restore fixed debug keystore
              env:
                  DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
              run: |
                  test -n "$DEBUG_KEYSTORE_BASE64" || { echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set"; exit 1; }
                  mkdir -p ~/.android
                  echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

            - name: Build debug APK
              run: ./gradlew -PVERSION_NAME="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)-phone-${GITHUB_SHA::7}" assembleFossDebug

            - name: Upload debug APK
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: "phone-build-foss-debug"
                  path: "app/build/outputs/apk/foss/debug/*debug.apk"
